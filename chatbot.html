<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Chatbot | Loki</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script><style>#log{height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}.m{max-width:80%;padding:10px 14px;border-radius:16px;animation:in .25s}.bot{background:var(--bubble);border-bottom-left-radius:4px}.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mute);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-4px)}}@keyframes in{from{opacity:0;transform:translateY(6px)}}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style></head><body>
<header class="top"><a href="index.html#projects">Back to portfolio</a><span>Nova Chatbot</span></header><main class="wrap"><h1>Nova Chatbot</h1><p class="lede">Ask Nova about me, my skills or my projects.</p>
<div class="panel"><div id="log" aria-live="polite"></div><div class="chips" id="chips"></div>
<form id="f" class="row" style="margin:0"><input id="q" placeholder="Type a message" aria-label="Message" autocomplete="off"><button>Send</button></form></div></main>
<script>
const R=[[/hello|hi\b|hey/,'Hi, I am Nova. Ask me about Loki, his projects or his skills.'],[/skill|stack|tech|language/,'Loki works in Python (his strongest), JavaScript, HTML and CSS, plus a little React, SQL and Supabase.'],[/project|built|work/,'He has built six projects: weather, this chatbot, school and library systems, a task tracker and a grade manager.'],[/contact|email|hire|reach/,'Email danielchristian5444@gmail.com or use the form on the portfolio.'],[/where|location|from|live/,'Loki is based in Lokoja, Nigeria.'],[/time/,()=>'It is '+new Date().toLocaleTimeString()+' for you.'],[/joke/,'Why do programmers like dark mode? Light attracts bugs.'],[/thank/,'Any time.']];
const add=(t,c)=>{const d=document.createElement('div');d.className='m '+c;d.innerHTML=t;log.append(d);log.scrollTop=1e9;return d};
function say(t){add(t.replace(/</g,'&lt;'),'me');const d=add('<span class="dots"><span></span><span></span><span></span></span>','bot');
setTimeout(()=>{const r=R.find(([k])=>k.test(t.toLowerCase()));const a=r?(typeof r[1]=='function'?r[1]():r[1]):'I am a small bot, so try: skills, projects, contact or joke.';d.textContent=a;log.scrollTop=1e9},650)}
['Skills','Projects','Contact','Joke'].forEach(c=>{const b=document.createElement('button');b.className='ghost';b.textContent=c;b.onclick=()=>say(c);chips.append(b)});
f.onsubmit=e=>{e.preventDefault();if(q.value.trim())say(q.value.trim());q.value=''};add('Hi, I am Nova. What would you like to know?','bot');
</script></body></html>
